[package]
name = "rust-aed"
version = "0.1.0"
edition = "2024"
authors = ["clearclown"]
description = "マルチプロバイダー対応 Rust 製 OCR・ドキュメント抽出ライブラリ"
license = "MIT"
repository = "https://github.com/example/rust-aed"
documentation = "https://docs.rs/rust-aed"
readme = "README.md"
keywords = ["ocr", "claude", "openai", "vision", "document-extraction"]
categories = ["text-processing", "api-bindings"]

[features]
# デフォルトは Claude のみ有効
default = ["claude"]

# ==== プロバイダー Feature Flags ====

# Anthropic Claude
claude = []

# OpenAI GPT-4o
openai = []

# Google Gemini
gemini = []

# xAI Grok
xai = []

# ==== 中国系 AI プロバイダー ====

# Alibaba Qwen (DashScope)
qwen = []

# DeepSeek
deepseek = []

# Zhipu GLM
glm = []

# 中国系 AI 全部
chinese-ai = ["qwen", "deepseek", "glm"]

# ==== ローカル LLM ====

# LM Studio (OpenAI 互換)
lmstudio = []

# ==== ハイブリッド ====

# GCP Vision + LLM
hybrid = ["gcp-vision"]
gcp-vision = []

# ==== ユーティリティ ====

# CLI ツール
cli = ["clap", "tracing-subscriber"]

# 全プロバイダー有効
full = [
    "claude",
    "openai",
    "gemini",
    "xai",
    "chinese-ai",
    "lmstudio",
    "hybrid",
]

[dependencies]
# 非同期ランタイム
tokio = { version = "1", features = ["full"] }

# HTTP クライアント
reqwest = { version = "0.12", features = ["json", "stream"] }

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 エンコード
base64 = "0.22"

# エラーハンドリング
thiserror = "2"

# ログ・トレース
tracing = "0.1"

# JSON Schema 生成
schemars = "0.8"

# 設定ファイル
toml = "0.8"

# CLI (オプション)
clap = { version = "4", features = ["derive"], optional = true }

# ログ subscriber (CLI用)
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# ファイルハッシュ
sha2 = "0.10"

# 非同期ユーティリティ
futures = "0.3"

# async trait (dyn-compatible)
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[example]]
name = "basic_ocr"
path = "examples/basic_ocr.rs"

[[example]]
name = "vertical_text"
path = "examples/vertical_text.rs"

[[example]]
name = "invoice_extraction"
path = "examples/invoice_extraction.rs"

[[example]]
name = "batch_processing"
path = "examples/batch_processing.rs"

[[example]]
name = "batch_to_output"
path = "examples/batch_to_output.rs"

[[bin]]
name = "aed"
path = "src/bin/cli.rs"
required-features = ["cli"]

[profile.release]
lto = true
codegen-units = 1
strip = true
